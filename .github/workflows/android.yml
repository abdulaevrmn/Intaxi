name: Build INTAXI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: gradle :app:assembleDebug :passenger:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INTAXI-Driver-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Passenger APK
        uses: actions/upload-artifact@v4
        with:
          name: INTAXI-Passenger-APK
          path: passenger/build/outputs/apk/debug/passenger-debug.apk
